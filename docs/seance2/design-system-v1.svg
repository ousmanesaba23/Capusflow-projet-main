ont-weight="400" fill="#1B6E3A">#E3F2E8 / #1B6E3A</text><text x="242" y="392" font-size="11" font-weight="700" fill="#1B6E3A">contraste 5,43:1</text><rect x="416" y="292" width="172" height="116" rx="12" fill="#FFFFFF" stroke="#C3C7CE" stroke-width="1"/><text x="430" y="322" font-size="18" font-weight="700" fill="#1A1C1E">Aa Texte</text><text x="430" y="348" font-size="12" font-weight="600" fill="#1A1C1E">surface</text><text x="430" y="370" font-size="11" font-weight="400" fill="#1A1C1E">#FFFFFF / #1A1C1E</text><text x="430" y="392" font-size="11" font-weight="700" fill="#1A1C1E">contraste 17,09:1</text><rect x="604" y="292" width="172" height="116" rx="12" fill="#F6F7F9" stroke="#C3C7CE" stroke-width="1"/><text x="618" y="322" font-size="18" font-weight="700" fill="#1A1C1E">Aa Texte</text><text x="618" y="348" font-size="12" font-weight="600" fill="#1A1C1E">background</text><text x="618" y="370" font-size="11" font-weight="400" fill="#1A1C1E">#F6F7F9 / #1A1C1E</text><text x="618" y="392" font-size="11" font-weight="700" fill="#1A1C1E">contraste 15,94:1</text><rect x="792" y="292" width="172" height="116" rx="12" fill="#FFFFFF" stroke="#C3C7CE" stroke-width="1"/><text x="806" y="322" font-size="18" font-weight="700" fill="#535960">Aa Texte</text><text x="806" y="348" font-size="12" font-weight="600" fill="#535960">onSurfaceVariant</text><text x="806" y="370" font-size="11" font-weight="400" fill="#535960">#FFFFFF / #535960</text><text x="806" y="392" font-size="11" font-weight="700" fill="#535960">contraste 7,08:1</text><rect x="980" y="292" width="172" height="116" rx="12" fill="#C3C7CE" stroke="#C3C7CE" stroke-width="1"/><text x="994" y="322" font-size="18" font-weight="700" fill="#1A1C1E">Aa Texte</text><text x="994" y="348" font-size="12" font-weight="600" fill="#1A1C1E">outline (décor)</text><text x="994" y="370" font-size="11" font-weight="400" fill="#1A1C1E">#C3C7CE / #1A1C1E</text><text x="994" y="392" font-size="11" font-weight="700" fill="#1A1C1E">contraste pas de texte</text><text x="40" y="456" font-size="20" font-weight="700" fill="#1A1C1E">2. Typographie — Roboto (police système)</text><text x="40" y="496" font-size="24" font-weight="700" fill="#1A1C1E">headlineSmall</text><text x="330" y="496" font-size="13" font-weight="400" fill="#535960">24 sp / 32 · Titres d'écran</text><text x="40" y="536" font-size="22" font-weight="600" fill="#1A1C1E">titleLarge</text><text x="330" y="536" font-size="13" font-weight="400" fill="#535960">22 sp / 28 · Barre d'application</text><text x="40" y="576" font-size="16" font-weight="600" fill="#1A1C1E">titleMedium</text><text x="330" y="576" font-size="13" font-weight="400" fill="#535960">16 sp / 24 · Titre de tâche</text><text x="40" y="616" font-size="16" font-weight="400" fill="#1A1C1E">bodyLarge</text><text x="330" y="616" font-size="13" font-weight="400" fill="#535960">16 sp / 24 · Texte courant, champs</text><text x="40" y="656" font-size="14" font-weight="400" fill="#1A1C1E">bodyMedium</text><text x="330" y="656" font-size="13" font-weight="400" fill="#535960">14 sp / 20 · Sous-titres (cours · date)</text><text x="40" y="696" font-size="14" font-weight="600" fill="#1A1C1E">labelLarge</text><text x="330" y="696" font-size="13" font-weight="400" fill="#535960">14 sp / 20 · Boutons, filtres</text><text x="640" y="456" font-size="20" font-weight="700" fill="#1A1C1E">3. Composants</text><text x="640" y="490" font-size="13" font-weight="700" fill="#535960">Bouton principal (FilledButton)</text><rect x="640" y="500" width="240" height="48" rx="12" fill="#1E5AA8"/><text x="760" y="530" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Marquer comme fait</text><rect x="896" y="500" width="240" height="48" rx="12" fill="#E3E5E8"/><text x="1016" y="530" font-size="14" font-weight="600" fill="#535960" text-anchor="middle">Désactivé</text><text x="640" y="566" font-size="12" font-weight="400" fill="#535960">Hauteur 48 dp · rayon 12 · pleine largeur dans les formulaires</text><text x="640" y="600" font-size="13" font-weight="700" fill="#535960">Carte de tâche (Card + ListTile)</text><rect x="640" y="610" width="496" height="76" rx="12" fill="#FFFFFF" stroke="#C3C7CE" stroke-width="1"/><rect x="658" y="636" width="22" height="22" rx="4" fill="#FFFFFF" stroke="#535960" stroke-width="2"/><text x="696" y="640" font-size="16" font-weight="600" fill="#1A1C1E">TP Flutter : écran Échéances</text><text x="696" y="664" font-size="14" font-weight="400" fill="#535960">Programmation mobile · ven. 27 nov.</text><rect x="1010" y="634" width="106" height="28" rx="14" fill="#FBE9E7"/><text x="1063" y="653" font-size="12" font-weight="700" fill="#B3261E" text-anchor="middle">⚠ En retard</text><text x="640" y="704" font-size="12" font-weight="400" fill="#535960">Hauteur min. 72 dp · rayon 12 · statut = icône + texte (jamais la couleur seule)</text><text x="640" y="738" font-size="13" font-weight="700" fill="#535960">Champ de saisie (TextFormField)</text><rect x="640" y="748" width="240" height="56" rx="12" fill="#FFFFFF" stroke="#535960" stroke-width="1"/><text x="656" y="782" font-size="15" font-weight="400" fill="#1A1C1E">Programmation mobile</text><rect x="896" y="748" width="240" height="56" rx="12" fill="#FFFFFF" stroke="#B3261E" stroke-width="2"/><text x="912" y="782" font-size="15" font-weight="400" fill="#1A1C1E"></text><text x="912" y="822" font-size="12" font-weight="700" fill="#B3261E">⚠ Le titre est obligatoire</text><text x="640" y="846" font-size="12" font-weight="400" fill="#535960">Bordure arrondie 12 · libellé visible · erreur en texte sous le champ</text><text x="40" y="760" font-size="20" font-weight="700" fill="#1A1C1E">4. Espacements et formes</text><rect x="40" y="790" width="8" height="8" rx="2" fill="#1E5AA8"/><text x="40" y="870" font-size="13" font-weight="400" fill="#1A1C1E">4 dp</text><rect x="130" y="790" width="16" height="16" rx="2" fill="#1E5AA8"/><text x="130" y="870" font-size="13" font-weight="400" fill="#1A1C1E">8 dp</text><rect x="220" y="790" width="24" height="24" rx="2" fill="#1E5AA8"/><text x="220" y="870" font-size="13" font-weight="400" fill="#1A1C1E">12 dp</text><rect x="310" y="790" width="32" height="32" rx="2" fill="#1E5AA8"/><text x="310" y="870" font-size="13" font-weight="400" fill="#1A1C1E">16 dp</text><rect x="400" y="790" width="48" height="48" rx="2" fill="#1E5AA8"/><text x="400" y="870" font-size="13" font-weight="400" fill="#1A1C1E">24 dp</text><rect x="490" y="790" width="64" height="64" rx="2" fill="#1E5AA8"/><text x="490" y="870" font-size="13" font-weight="400" fill="#1A1C1E">32 dp</text><text x="40" y="900" font-size="13" font-weight="400" fill="#535960">Rayon des cartes, champs et boutons : 12 dp · cible tactile minimale : 48 × 48 dp</text><text x="40" y="960" font-size="20" font-weight="700" fill="#1A1C1E">5. Tailles de fenêtre visées (classes Material 3)</text><rect x="40" y="984" width="150" height="46" rx="12" fill="#DCE7F7"/><text x="56" y="1013" font-size="14" font-weight="700" fill="#0B2E59">Compacte · &lt; 600 dp</text><text x="440" y="1013" font-size="13" font-weight="400" fill="#1A1C1E">Téléphone portrait (cible principale : 360–412 dp). Liste seule, NavigationBar en bas.</text><rect x="40" y="1046" width="260" height="46" rx="12" fill="#DCE7F7"/><text x="56" y="1075" font-size="14" font-weight="700" fill="#0B2E59">Moyenne · 600–839 dp</text><text x="440" y="1075" font-size="13" font-weight="400" fill="#1A1C1E">Grand téléphone en paysage, petite tablette. Liste seule, marges plus larges.</text><rect x="40" y="1108" width="380" height="46" rx="12" fill="#1E5AA8"/><text x="56" y="1137" font-size="14" font-weight="700" fill="#FFFFFF">Étendue · ≥ 840 dp</text><text x="440" y="1137" font-size="13" font-weight="400" fill="#1A1C1E">Tablette. Liste et détail côte à côte (LayoutBuilder, seuil 840 dp).</text></svg>
